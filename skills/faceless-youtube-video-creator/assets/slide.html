    <script>
      ;(function () {
        const stage = document.getElementById('stage')
        const esc = (s) =>
          String(s ?? '').replace(
            /[&<>"]/g,
            (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]
          )
        const rich = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
        const withHl = (text, hl) => {
          const t = String(text ?? '')
          const i = hl ? t.indexOf(hl) : -1
          return i < 0
            ? rich(t)
            : rich(t.slice(0, i)) +
                '<span class="hl">' +
                rich(hl) +
                '</span>' +
                rich(t.slice(i + hl.length))
        }
        const el = (tag, cls, parent, html) => {
          const e = document.createElement(tag)
          if (cls) e.className = cls
          if (html != null) e.innerHTML = html
          if (parent) parent.appendChild(e)
          return e
        }
        let fitTargets = []
        let mustFit = []
        let speech = []
        let A = [] // Web Animations of the slide on screen (window.anim)
        let ticks = [] // per-frame callbacks (count-ups)

        // shrink a heading until its box stops overflowing
        const fit = (h, start, min) => {
          let s = start
          h.style.fontSize = s + 'px'
          fitTargets.push({ h, min })
          const box = h.closest('.box')
          while (
            s > min &&
            (box.scrollHeight > box.clientHeight + 1 || h.scrollWidth > h.clientWidth + 1)
          ) {
            s -= 4
            h.style.fontSize = s + 'px'
          }
        }

        // doodles come from assets/doodles.js, inlined by the renderer in the script tag above
        const doodle = (name) => (window.doodle ? window.doodle(name) : '')

        // a Short (html.vertical, 1080×1920): pictures keep their 1920×1080 drawing, scaled into a band
        const vertical = () => document.documentElement.classList.contains('vertical')
        const PICTURE = ['scene', 'illustration', 'flow']
        // after show() has built the slide: everything but the text box and the chrome moves into one
        // 1920×1080 .frame16. Pictures: scaled to 0.8 (the middle ~70 % shows; `focus` = the x in the
        // 1920 frame to centre on) or, with `fit: true` (and always for flow), to the full width; a band under
        // the text, or centred without text. Other layouts' extras (particles) cover the whole frame.
        const frameVertical = (S, layout, box) => {
          const chrome = new Set([
            box,
            ...stage.querySelectorAll(':scope > .label, :scope > .brand, :scope > .progress')
          ])
          const kids = [...stage.children].filter((c) => !chrome.has(c))
          if (!kids.length) return
          const pic = PICTURE.includes(layout)
          const k = pic ? (S.fit || layout === 'flow' ? 1080 / 1920 : 0.8) : 1920 / 1080
          const w = 1920 * k
          const h = 1080 * k
          const left = Math.min(0, Math.max(1080 - w, 540 - (S.focus ?? 960) * k))
          const top = !pic ? 0 : S.text || S.title ? 600 : Math.round((1920 - h) / 2)
          const f = el('div', 'frame16')
          f.style.left = left.toFixed(1) + 'px'
          f.style.top = top + 'px'
          f.style.transform = `scale(${k})`
          stage.insertBefore(f, stage.firstChild)
          for (const c of kids) f.appendChild(c)
        }

        // ---------- illustrated worlds: particles, marks, camera ----------
        // deterministic noise, seeded from the slide, so a slide renders the same every time
        const seeded = (str) => {
          let h = 2166136261
          for (const c of String(str)) h = Math.imul(h ^ c.charCodeAt(0), 16777619)
          let s = (h >>> 0) % 2147483646 || 1
          return () => {
            s = (s * 16807) % 2147483647
            return (s - 1) / 2147483646
          }
        }
        // particles: built by show() (the still shows them), moved by anim() (fxParts: element + keyframes)
        let fxParts = []
        const FX = {
          // n, then one particle: [css, keyframes, duration ms]; `p` = where in its cycle it starts
          snow: [
            70,
            (r, i) => {
              const z = r()
              const size = 4 + z * 9
              const x = r() * 1920
              const sway = (r() - 0.5) * 120
              return [
                {
                  left: x + 'px',
                  top: '-20px',
                  width: size + 'px',
                  height: size + 'px',
                  background: '#fff',
                  opacity: 0.55 + z * 0.4,
                  filter: z > 0.75 ? 'blur(2px)' : ''
                },
                [
                  { transform: 'translate(0, 0)' },
                  { transform: `translate(${sway}px, 560px)` },
                  { transform: 'translate(0, 1120px)' }
                ],
                (16000 - z * 7000) | 0
              ]
            }
          ],
          dust: [
            45,
            (r) => {
              const size = 2 + r() * 4
              return [
                {
                  left: r() * 1920 + 'px',
                  top: 200 + r() * 880 + 'px',
                  width: size + 'px',
                  height: size + 'px',
                  background: 'color-mix(in srgb, var(--accent) 35%, #fff)',
                  boxShadow: '0 0 8px color-mix(in srgb, var(--accent) 50%, #fff)'
                },
                [
                  { opacity: 0, transform: 'translate(0, 0)' },
                  {
                    opacity: 0.8,
                    transform: `translate(${(r() - 0.5) * 60}px, -90px)`,
                    offset: 0.5
                  },
                  { opacity: 0, transform: `translate(${(r() - 0.5) * 60}px, -200px)` }
                ],
                (8000 + r() * 6000) | 0
              ]
            }
          ],
          bokeh: [
            14,
            (r) => {
              const size = 60 + r() * 140
              return [
                {
                  left: r() * 1920 - size / 2 + 'px',
                  top: r() * 1080 - size / 2 + 'px',
                  width: size + 'px',
                  height: size + 'px',
                  background: r() < 0.3 ? 'color-mix(in srgb, var(--accent) 50%, #fff)' : '#fff',
                  filter: 'blur(14px)'
                },
                [
                  { opacity: 0.06, transform: 'translate(0, 0)' },
                  {
                    opacity: 0.2,
                    transform: `translate(${(r() - 0.5) * 160}px, ${(r() - 0.5) * 60}px)`
                  },
                  { opacity: 0.06, transform: 'translate(0, 0)' }
                ],
                (14000 + r() * 8000) | 0
              ]
            }
          ],
          stars: [
            60,
            (r) => {
              const size = 2 + r() * 3
              return [
                {
                  left: r() * 1920 + 'px',
                  top: r() * 700 + 'px',
                  width: size + 'px',
                  height: size + 'px',
                  background: '#fff',
                  boxShadow: '0 0 6px #fff'
                },
                [{ opacity: 1 }, { opacity: 0.15 }, { opacity: 1 }],
                (2000 + r() * 3000) | 0
              ]
            }
          ],
          sparkle: [
            12,
            (r) => {
              const size = 26 + r() * 30
              return [
                {
                  left: 120 + r() * 1680 + 'px',
                  top: 80 + r() * 800 + 'px',
                  width: size + 'px',
                  height: size + 'px',
                  background: 'color-mix(in srgb, var(--accent) 45%, #fff)',
                  filter: 'drop-shadow(0 0 6px #fff)'
                },
                [
                  { opacity: 0, transform: 'scale(.2) rotate(0deg)' },
                  { opacity: 1, transform: 'scale(1) rotate(45deg)', offset: 0.3 },
                  { opacity: 0, transform: 'scale(.2) rotate(90deg)', offset: 0.6 },
                  { opacity: 0, transform: 'scale(.2) rotate(90deg)' }
                ],
                (2400 + r() * 2000) | 0,
                'sparkle'
              ]
            }
          ],
          rain: [
            110,
            (r) => {
              const h = 30 + r() * 30
              return [
                {
                  left: r() * 2100 - 90 + 'px',
                  top: -60 + 'px',
                  width: '3px',
                  height: h + 'px',
                  background: 'rgba(255,255,255,.45)',
                  rotate: '12deg'
                },
                [{ transform: 'translate(0, 0)' }, { transform: 'translate(-240px, 1180px)' }],
                (650 + r() * 400) | 0,
                'rain'
              ]
            }
          ],
          embers: [
            30,
            (r) => {
              const size = 3 + r() * 5
              return [
                {
                  left: r() * 1920 + 'px',
                  top: 700 + r() * 420 + 'px',
                  width: size + 'px',
                  height: size + 'px',
                  background: 'var(--accent)',
                  boxShadow: '0 0 12px var(--accent)'
                },
                [
                  { opacity: 0, transform: 'translate(0, 0)' },
                  {
                    opacity: 1,
                    transform: `translate(${(r() - 0.5) * 80}px, -200px)`,
                    offset: 0.3
                  },
                  {
                    opacity: 0.4,
                    transform: `translate(${(r() - 0.5) * 160}px, -460px)`,
                    offset: 0.7
                  },
                  { opacity: 0, transform: `translate(${(r() - 0.5) * 200}px, -640px)` }
                ],
                (4000 + r() * 4000) | 0
              ]
            }
          ]
        }
        const fxKinds = (S) =>
          (Array.isArray(S.fx) ? S.fx : String(S.fx || '').split(/[\s,]+/)).filter((k) => FX[k])
        const buildFx = (S, before) => {
          const wrap = el('div', 'fx')
          stage.insertBefore(wrap, before)
          const r = seeded(JSON.stringify([S.fx, S.prompt, S.text, S.bg]))
          fxParts = []
          for (const kind of fxKinds(S)) {
            const [n, make] = FX[kind]
            for (let i = 0; i < n; i++) {
              const [css, kf, dur, cls] = make(r, i)
              const e = el('i', cls || '', wrap)
              Object.assign(e.style, css)
              const p = r()
              fxParts.push({ e, kf, dur, p })
              // the still: the particle where its cycle starts at t = 0
              const a = e.animate(kf, { duration: dur, fill: 'both' })
              a.currentTime = p * dur
              e.dataset.still = JSON.stringify(
                Object.fromEntries(['opacity', 'transform'].map((k) => [k, getComputedStyle(e)[k]]))
              )
              a.cancel()
              Object.assign(e.style, JSON.parse(e.dataset.still))
            }
          }
        }

        // marks: pins, rings, glowing paths, arrows, tags drawn over the picture (coordinates in the 1920×1080
        // frame), on the camera layer of the picture they point at, so they stick to it while the camera moves
        let markIssues = []
        const buildMarks = (S, layout) => {
          markIssues = []
          const world = stage.querySelector('.world')
          const backDepth = world ? (world.querySelector('.layer')?.dataset.depth ?? '1') : '1'
          const layer = el('div', 'layer marks')
          layer.dataset.depth = S.marksDepth ?? backDepth
          if (world) world.insertBefore(layer, world.querySelector(':scope > svg.scene'))
          else
            stage.insertBefore(
              layer,
              stage.querySelector('svg.scene')?.nextSibling || stage.firstChild
            )
          let svg = ''
          const tags = []
          const color = (m) => m.color || 'var(--accent)'
          const inside = (x, y, what) => {
            if (!(x >= 0 && x <= 1920 && y >= 0 && y <= 1080))
              markIssues.push(`${what} at [${x}, ${y}] is off the 1920×1080 frame`)
          }
          S.marks.forEach((m, i) => {
            const glow = `filter="drop-shadow(0 0 10px ${color(m)})"`
            if (m.pin) {
              const [x, y] = m.pin
              inside(x, y, 'pin')
              svg +=
                `<g transform="translate(${x} ${y})"><ellipse cx="0" cy="0" rx="24" ry="8" fill="rgba(0,0,0,.28)"/>` +
                `<g class="mk" data-mk="pin"><path d="M0 0 C-14 -26 -40 -44 -40 -74 A40 40 0 1 1 40 -74 C40 -44 14 -26 0 0 Z" style="fill:${color(m)}"/>` +
                `<circle cx="0" cy="-74" r="17" fill="#fff"/></g></g>`
              if (m.label) tags.push({ x, y: y + 18, text: m.label, pin: true })
            } else if (m.ring) {
              const [x, y] = m.ring
              const R = m.r || 120
              inside(x, y, 'ring')
              svg +=
                `<g class="mk" data-mk="ring"><circle cx="${x}" cy="${y}" r="${R}" style="fill:${color(m)};fill-opacity:.12;stroke:${color(m)};stroke-width:8" ${glow}/>` +
                `<circle class="mk-pulse" cx="${x}" cy="${y}" r="${R}" style="fill:none;stroke:${color(m)};stroke-width:5"/></g>`
            } else if (m.path) {
              svg += `<g class="mk" data-mk="path"><path class="mk-line" d="${esc(m.path)}" style="fill:none;stroke:${color(m)};stroke-width:${m.width || 10};stroke-linecap:round;stroke-linejoin:round" ${glow}/></g>`
            } else if (m.arrow) {
              const [[x1, y1], [x2, y2]] = m.arrow
              inside(x1, y1, 'arrow start')
              inside(x2, y2, 'arrow end')
              const bend = m.bend ?? 0.22
              const cx = (x1 + x2) / 2 - (y2 - y1) * bend
              const cy = (y1 + y2) / 2 + (x2 - x1) * bend
              const ang = (Math.atan2(y2 - cy, x2 - cx) * 180) / Math.PI
              svg +=
                `<g class="mk" data-mk="arrow"><path class="mk-line" d="M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}" style="fill:none;stroke:${color(m)};stroke-width:${m.width || 10};stroke-linecap:round" ${glow}/>` +
                `<g transform="translate(${x2} ${y2}) rotate(${ang.toFixed(1)})"><path class="mk-head" d="M6 0 L-34 -22 L-26 0 L-34 22 Z" style="fill:${color(m)}"/></g></g>`
            } else if (m.tag) {
              const [x, y] = m.tag
              inside(x, y, 'tag')
              tags.push({ x, y, text: m.text || '' })
            }
          })
          layer.innerHTML = `<svg class="mk-svg" viewBox="0 0 1920 1080">${svg}</svg>`
          for (const t of tags) {
            const d = el('div', 'mk-tag mk' + (t.pin ? ' on-pin' : ''), layer, rich(t.text))
            d.dataset.mk = 'tag'
            d.style.left = t.x + 'px'
            d.style.top = t.y + 'px'
          }
        }

        // camera: one slow move over the whole slide, applied to every depth layer ([data-depth]); near layers
        // move more than far ones (parallax). Moves are in px of content motion at depth 1.
        const MOVES = {
          push: { zoom: [1, 1.1] },
          pull: { zoom: [1.1, 1] },
          'pan-right': { x: [70, -70] },
          'pan-left': { x: [-70, 70] },
          rise: { y: [-45, 45] },
          sink: { y: [45, -45] },
          drift: { zoom: [1, 1.05], x: [24, -24] }
        }
        const cameraOf = (S) => {
          let c = S._camera
          if (c == null || c === false || c === 'none' || c === 'off') return null
          if (c === 'auto' || c === true) {
            const layered =
              S.layout === 'illustration' ||
              ((S.layout === 'scene' || S.layout === 'flow') &&
                window.sceneIsLayered &&
                window.sceneIsLayered(S))
            if (!layered) return null
            c = 'drift'
          }
          if (typeof c === 'string') return MOVES[c] || null
          // {"to": [x, y], "zoom": 1.3} pushes toward a point; or {zoom: [a, b], x: [a, b], y: [a, b], at: [x, y]}
          if (c.to) return { zoom: [1, c.zoom || 1.25], at: c.to }
          return c
        }
        const cameraFrames = (c, k) => {
          const z = c.zoom || [1, 1]
          const xs = c.x || [0, 0]
          const ys = c.y || [0, 0]
          const at = c.at || [960, 540]
          const fx = Math.min(1680, Math.max(240, at[0]))
          const fy = Math.min(920, Math.max(160, at[1]))
          const poses = [0, 1].map((i) => ({
            s: 1 + (Math.max(1, z[i]) - 1) * k,
            px: xs[i] * k,
            py: ys[i] * k
          }))
          // extra zoom so the layer always covers the frame while it moves
          const need = (p) =>
            Math.max(0, p.px / fx, -p.px / (1920 - fx), p.py / fy, -p.py / (1080 - fy))
          const over = Math.max(...poses.map((p) => Math.max(0, need(p) - (p.s - 1)))) + 0.004
          return poses.map((p) => ({
            transform: `translate(${(fx + p.px).toFixed(2)}px, ${(fy + p.py).toFixed(2)}px) scale(${(p.s + over).toFixed(4)}) translate(${-fx}px, ${-fy}px)`
          }))
        }

        // ---------- flow: boxes and arrows, laid out from `nodes` + `links` ----------
        // shape "auto" ranks the nodes along the arrows (chains, branches, merges; `direction` row | column),
        // "cycle" puts them on a loop, "hub" puts the first one in the middle and the rest around it.
        let flowIssues = []
        const buildFlow = (S, y0) => {
          flowIssues = []
          const nodes = (S.nodes || [])
            .map((n) => (typeof n === 'string' ? { text: n } : { ...n }))
            .map((n, i) => ({ ...n, id: String(n.id ?? i), i }))
          if (!nodes.length) return
          if (nodes.length > 7)
            flowIssues.push('a flow takes at most 7 nodes: split it or merge some')
          const idx = Object.fromEntries(nodes.map((n) => [n.id, n.i]))
          const shape = S.shape || 'auto'
          const chain = (list) => list.slice(1).map((n, i) => [list[i].id, n.id])
          const raw =
            S.links ||
            (shape === 'hub'
              ? nodes.slice(1).map((n) => [nodes[0].id, n.id])
              : shape === 'cycle'
                ? nodes.map((n, i) => [n.id, nodes[(i + 1) % nodes.length].id])
                : chain(nodes))
          const links = raw
            .map((l) => (Array.isArray(l) ? { from: l[0], to: l[1], label: l[2] } : { ...l }))
            .map((l) => ({ ...l, from: String(l.from), to: String(l.to) }))
            .filter((l) => {
              const ok = idx[l.from] != null && idx[l.to] != null
              if (!ok)
                flowIssues.push(`a link names a node that doesn't exist: ${l.from} → ${l.to}`)
              return ok
            })
          const vis = S.visible != null ? S.visible : nodes.length
          const cur = S.current != null ? S.current : -1
          const on = new Set((S.on || []).map(String))
          const X0 = 130
          const X1 = 1790
          const Y1 = 1000
          const W = X1 - X0
          const H = Y1 - y0
          const col = S.direction === 'column'

          // centres and card widths
          const pos = []
          let cw = 360
          if (shape === 'cycle' || shape === 'hub') {
            const ring = shape === 'hub' ? nodes.slice(1) : nodes
            const n = ring.length
            cw = Math.min(380, Math.max(240, (W * 0.9) / Math.max(3, Math.ceil(n / 2) + 1) - 40))
            const cx = (X0 + X1) / 2
            const cy = (y0 + Y1) / 2
            const rx = W / 2 - cw / 2 - 10
            const ry = H / 2 - 80
            ring.forEach((nd, k) => {
              const a = -Math.PI / 2 + (2 * Math.PI * k) / n
              pos[nd.i] = [cx + rx * Math.cos(a), cy + ry * Math.sin(a)]
            })
            if (shape === 'hub') pos[0] = [cx, cy]
          } else {
            // rank = longest path along forward links (in list order); a link back up the list is a loop-back
            const rank = nodes.map(() => 0)
            for (let pass = 0; pass < nodes.length; pass++)
              for (const l of links)
                if (idx[l.from] < idx[l.to])
                  rank[idx[l.to]] = Math.max(rank[idx[l.to]], rank[idx[l.from]] + 1)
            const R = Math.max(...rank) + 1
            const byRank = Array.from({ length: R }, () => [])
            nodes.forEach((nd) => byRank[rank[nd.i]].push(nd.i))
            const most = Math.max(...byRank.map((r) => r.length))
            // the gap left for an arrow shrinks with the number of ranks, so 6–7 boxes in a row stay readable
            const slot = W / R
            const gap = R > 1 ? Math.max(60, Math.min(170, slot * 0.35)) : 0
            cw = col ? Math.min(560, W / most - 70) : Math.max(140, Math.min(460, slot - gap))
            byRank.forEach((list, r) =>
              list.forEach((i, k) => {
                const main = (r + 0.5) / R
                const cross = (k + 0.5) / list.length
                pos[i] = col ? [X0 + cross * W, y0 + main * H] : [X0 + main * W, y0 + cross * H]
              })
            )
          }

          // cards (measured, so arrows can attach to their edges)
          const rects = []
          const cards = nodes.map((nd) => {
            const hub = shape === 'hub' && nd.i === 0
            const c = el(
              'div',
              'fnode card' +
                (hub ? ' hub' : '') +
                (nd.tone === 'dark' ? ' dark' : '') +
                (nd.tone === 'accent' || on.has(nd.id) || nd.i === cur || hub ? ' on' : '') +
                (nd.i >= vis ? ' hidden' : ''),
              stage
            )
            c.dataset.i = nd.i
            const w = hub ? Math.min(460, cw + 80) : cw
            c.style.width = w + 'px'
            const tight = w < 260
            if (tight) c.classList.add('tight')
            const t = el('div', 'ft', c, rich(nd.text))
            if (nd.sub) el('div', 'fs', c, rich(nd.sub))
            // fit: 40px down to 26px, at most ~3 lines
            let fs = hub ? 60 : 52
            t.style.fontSize = fs + 'px'
            const minFs = tight ? 22 : 30
            while (fs > minFs && (c.scrollHeight > 260 || t.scrollWidth > t.clientWidth + 1)) {
              fs -= 2
              t.style.fontSize = fs + 'px'
            }
            if (c.scrollHeight > 280)
              flowIssues.push(`node "${nd.text}" is too long for its box: shorten it (≤ 5 words)`)
            // a single word wider than the box would spill over its edges even at the smallest size
            if (t.scrollWidth > t.clientWidth + 1)
              flowIssues.push(
                `node "${nd.text}" has a word wider than its box: shorter words, or fewer nodes in a row`
              )
            const h = c.offsetHeight
            const [x, y] = pos[nd.i]
            c.style.left = Math.round(x - w / 2) + 'px'
            c.style.top = Math.round(y - h / 2) + 'px'
            rects[nd.i] = { x: x - w / 2, y: y - h / 2, w, h, cx: x, cy: y }
            return c
          })
          // one text size for every box (the smallest any box needed; the hub keeps its own), so a row reads
          // evenly; the boxes are re-centred on their new heights
          const ring = cards.filter((c) => !c.classList.contains('hub'))
          const common = Math.min(
            ...ring.map((c) => parseFloat(c.querySelector('.ft').style.fontSize))
          )
          ring.forEach((c) => {
            c.querySelector('.ft').style.fontSize = common + 'px'
            const r = rects[Number(c.dataset.i)]
            r.h = c.offsetHeight
            r.y = r.cy - r.h / 2
            c.style.top = Math.round(r.y) + 'px'
          })
          // crowding: overlapping cards or cards off the frame
          rects.forEach((a, i) => {
            if (a.x < 40 || a.x + a.w > 1880 || a.y < y0 - 40 || a.y + a.h > 1060)
              flowIssues.push(
                `node "${nodes[i].text}" runs off the frame: fewer nodes or shorter text`
              )
            rects.forEach((b, j) => {
              if (
                j > i &&
                a.x < b.x + b.w + 12 &&
                b.x < a.x + a.w + 12 &&
                a.y < b.y + b.h + 12 &&
                b.y < a.y + a.h + 12
              )
                flowIssues.push('two nodes overlap: fewer nodes per column, or shorter text')
            })
          })

          // arrows: side to side between ranks, centre-to-centre (clipped at the card edges) otherwise
          const clip = (r, dx, dy, pad = 16) => {
            const t = Math.min(
              (r.w / 2 + pad) / Math.max(Math.abs(dx), 1e-6),
              (r.h / 2 + pad) / Math.max(Math.abs(dy), 1e-6)
            )
            return [r.cx + dx * t, r.cy + dy * t]
          }
          let svg = ''
          const labels = []
          const dots = []
          const arrows = S.arrows !== false
          links.forEach((l, k) => {
            const a = rects[idx[l.from]]
            const b = rects[idx[l.to]]
            const shown = idx[l.from] < vis && idx[l.to] < vis
            let p0, c1, c2, p1
            const forward = shape === 'auto' && idx[l.from] < idx[l.to]
            if (forward && !col && b.cx - a.cx > 40) {
              p0 = [a.x + a.w + 14, a.cy]
              p1 = [b.x - (arrows ? 30 : 14), b.cy]
              const m = (p1[0] - p0[0]) / 2
              c1 = [p0[0] + m, p0[1]]
              c2 = [p1[0] - m, p1[1]]
            } else if (forward && col && b.cy - a.cy > 40) {
              p0 = [a.cx, a.y + a.h + 14]
              p1 = [b.cx, b.y - (arrows ? 30 : 14)]
              const m = (p1[1] - p0[1]) / 2
              c1 = [p0[0], p0[1] + m]
              c2 = [p1[0], p1[1] - m]
            } else if (shape === 'auto') {
              // a loop back: arc over the top (row) or round the side (column)
              p0 = col ? [a.x + a.w + 14, a.cy] : [a.cx, a.y - 14]
              p1 = col ? [b.x + b.w + (arrows ? 30 : 14), b.cy] : [b.cx, b.y - (arrows ? 30 : 14)]
              const lift = 150
              c1 = col ? [p0[0] + lift, p0[1]] : [p0[0], p0[1] - lift]
              c2 = col ? [p1[0] + lift, p1[1]] : [p1[0], p1[1] - lift]
            } else {
              const dx = b.cx - a.cx
              const dy = b.cy - a.cy
              const len = Math.hypot(dx, dy) || 1
              p0 = clip(a, dx, dy)
              p1 = clip(b, -dx, -dy, arrows ? 30 : 16)
              // a cycle bows outward, away from the middle; a hub's spokes stay straight
              const bow = shape === 'cycle' ? 0.18 * len : 0
              const mx = (p0[0] + p1[0]) / 2
              const my = (p0[1] + p1[1]) / 2
              const ox = mx - (X0 + X1) / 2
              const oy = my - (y0 + Y1) / 2
              const ol = Math.hypot(ox, oy) || 1
              const ctl = [mx + (ox / ol) * bow, my + (oy / ol) * bow]
              c1 = ctl
              c2 = ctl
            }
            const d = `M${p0[0].toFixed(1)} ${p0[1].toFixed(1)} C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p1[0].toFixed(1)} ${p1[1].toFixed(1)}`
            const ang = (Math.atan2(p1[1] - c2[1], p1[0] - c2[0]) * 180) / Math.PI
            svg +=
              `<g class="fl-link" data-k="${k}" data-from="${idx[l.from]}" data-to="${idx[l.to]}" style="${shown ? '' : 'visibility:hidden'}">` +
              `<path class="fl-line" d="${d}"${l.dashed ? ' stroke-dasharray="16 14"' : ''}/>` +
              (arrows
                ? `<g transform="translate(${p1[0].toFixed(1)} ${p1[1].toFixed(1)}) rotate(${ang.toFixed(1)})"><path class="fl-head" d="M18 0 L-14 -17 L-6 0 L-14 17 Z"/></g>`
                : '') +
              `</g>`
            // the label sits on the curve's midpoint
            const bz = (t, i) =>
              (1 - t) ** 3 * p0[i] +
              3 * (1 - t) ** 2 * t * c1[i] +
              3 * (1 - t) * t * t * c2[i] +
              t ** 3 * p1[i]
            if (l.label) {
              // on a flat arrow the label floats just above it, so it never sits between two boxes
              const flat = Math.abs(p1[1] - p0[1]) < 60 && Math.abs(p1[0] - p0[0]) > 60
              labels.push({
                x: bz(0.5, 0),
                y: bz(0.5, 1) - (flat ? 40 : 0),
                text: l.label,
                k,
                shown
              })
            }
            if (shown && S.dots !== false) dots.push({ d, k })
          })
          const svgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
          svgEl.setAttribute('class', 'flow')
          svgEl.setAttribute('viewBox', '0 0 1920 1080')
          svgEl.innerHTML = svg
          stage.insertBefore(svgEl, cards[0])
          for (const lb of labels) {
            const e = el('div', 'flabel' + (lb.shown ? '' : ' hidden'), stage, rich(lb.text))
            e.dataset.k = lb.k
            e.style.left = lb.x + 'px'
            e.style.top = lb.y + 'px'
          }
          for (const dt of dots) {
            const e = el('div', 'fdot', stage)
            e.dataset.k = dt.k
            e.style.offsetPath = `path('${dt.d}')`
          }
        }

        // speech bubbles over the cast, on a near camera layer so they travel with the characters
        const bubbles = (cast) => {
          const said = cast.filter((c) => c.say)
          if (!said.length) return
          const wrap = el('div', 'plxdom', stage)
          wrap.dataset.depth = '1'
          for (const c of said) {
            const b = el('div', 'speech', wrap, rich(c.say))
            b.style.left = Math.min(1640, Math.max(280, c.x)) + 'px'
            b.style.bottom = Math.round(1080 - c.headTop + 34) + 'px'
            speech.push(b)
          }
        }

        window.show = function (S, C) {
          A.forEach((a) => a.cancel())
          A = []
          ticks = []
          speech = []
          markIssues = []
          flowIssues = []
          stage.innerHTML = ''
          fitTargets = []
          mustFit = []
          C = C || {}
          const layout = S.layout || 'statement'
          const dark =
            S.theme === 'dark' ||
            layout === 'chapter' ||
            layout === 'subscribe' ||
            ((layout === 'scene' || (layout === 'flow' && S.bg)) &&
              !!window.sceneIsDark &&
              window.sceneIsDark(S))
          const brand = C.brand !== false
          const T = C.theme || {}
          for (const k of ['ground', 'main', 'second', 'accent', 'marker'])
            if (T[k]) stage.style.setProperty('--' + k, T[k])
            else stage.style.removeProperty('--' + k)
          // `paper`: an exact background; walls, floors and hairlines then come from it and the ink, not from main
          const paperVars = T.paper
            ? {
                '--paper-set': T.paper,
                '--floor-set': `color-mix(in srgb, ${T.paper} 82%, ${T.second || '#111'})`,
                '--hair-set': `color-mix(in srgb, ${T.paper} 75%, ${T.second || '#111'})`
              }
            : {}
          for (const k of ['--paper-set', '--floor-set', '--hair-set'])
            if (paperVars[k]) stage.style.setProperty(k, paperVars[k])
            else stage.style.removeProperty(k)
          if (C.fonts && C.fonts.display) stage.style.setProperty('--display', C.fonts.display)
          if (C.fonts && C.fonts.body) stage.style.setProperty('--body', C.fonts.body)
          // `outline`: the characters' line width in px (0 = flat, no outlines)
          if (T.outline != null) stage.style.setProperty('--sc-lw', T.outline + 'px')
          else stage.style.removeProperty('--sc-lw')
          const texture = T.texture || 'dots'
          stage.className =
            (dark ? 'dark' : '') +
            (brand ? '' : ' nobrand') +
            (texture === 'grain'
              ? ' grain'
              : texture === 'paint'
                ? ' paint'
                : texture === 'soft'
                  ? ' soft'
                  : texture === 'none'
                    ? ' notex'
                    : '')
          const plain = layout === 'chapter' || layout === 'end'
          const logo = brand && window.LOGO && window.LOGO !== '__LOGO__' ? window.LOGO : ''
          if (!plain) {
            if (C.label) el('div', 'label', stage, esc(C.label))
            if (brand)
              el(
                'div',
                'brand',
                stage,
                (logo ? '<img src="' + logo + '">' : '') + esc(C.name || '')
              )
          }
          if (brand && C.progress != null)
            el('div', 'progress', stage).style.width = (C.progress * 100).toFixed(2) + '%'
          const box = el('div', 'box', stage)
          const heading = (text, size, min, cls = 'h') => {
            if (!text) return null
            const h = el('h1', cls, box, withHl(text, S.highlight))
            // a Short is watched on a phone: start a quarter bigger (fit() still shrinks it to the column)
            fit(h, vertical() ? Math.round(size * 1.25) : size, min)
            return h
          }

          if (layout === 'statement') {
            heading(S.text, S.size || 120, 64)
            if (S.sub) el('div', 'sub', box, rich(S.sub))
          } else if (layout === 'points') {
            heading(S.title, 76, 52)
            const ol = el('ol', 'points' + ((S.points || []).length > 4 ? ' many' : ''), box)
            ;(S.points || []).forEach((p, i) => {
              const done = S.done != null && i < S.done
              const dim = S.current != null && i !== S.current
              const hidden = S.visible != null && i >= S.visible
              const li = el(
                'li',
                'point card' +
                  (done ? ' done' : '') +
                  (dim ? ' dim' : '') +
                  (hidden ? ' hidden' : ''),
                ol
              )
              li.innerHTML =
                '<span class="num">' + (done ? '✓' : i + 1) + '</span><span>' + rich(p) + '</span>'
            })
            mustFit.push(box)
          } else if (layout === 'flow') {
            // optionally over a scene background (a layered world: the camera moves it, not the diagram)
            if (S.bg && window.scene)
              stage.insertAdjacentHTML(
                'afterbegin',
                window.scene({ ...S, cast: [], props: [] }, { textMode: 'none' }).svg
              )
            if (S.title) {
              box.classList.add(vertical() ? 'vtop' : 'flow-top')
              if (S.bg) box.classList.add('plate')
              heading(S.title, 64, 44)
            }
            buildFlow(S, S.title ? 300 : 140)
          } else if (layout === 'number') {
            heading(S.title, 70, 48)
            const n = el('div', 'bignum', box)
            n.innerHTML =
              (S.from
                ? '<span class="from">' + esc(S.from) + '</span><span class="arrow">→</span>'
                : '') +
              '<span class="to">' +
              esc(S.value) +
              '</span>'
            if (S.label) el('div', 'sub', box, rich(S.label))
            mustFit.push(box)
          } else if (layout === 'table') {
            heading(S.title, 64, 44)
            const card = el('div', 'card tablecard', box)
            const rows = S.rows || []
            card.style.setProperty('--tsize', (S.textSize || (rows.length > 6 ? 28 : 32)) + 'px')
            const cell = (c) => {
              const s = String(c ?? '')
              return /^\[.+\]$/.test(s)
                ? '<span class="pill">' + esc(s.slice(1, -1)) + '</span>'
                : rich(s)
            }
            card.innerHTML =
              '<table><thead><tr>' +
              (S.columns || []).map((c) => '<th>' + esc(c) + '</th>').join('') +
              '</tr></thead><tbody>' +
              rows
                .map(
                  (r, i) =>
                    '<tr class="' +
                    ((S.mark || []).includes(i) ? 'mark' : '') +
                    ((S.cut || []).includes(i) ? ' cut' : '') +
                    '">' +
                    r.map((c) => '<td>' + cell(c) + '</td>').join('') +
                    '</tr>'
                )
                .join('') +
              '</tbody></table>'
            if (S.note) el('div', 'note', box, rich(S.note))
            mustFit.push(box)
          } else if (layout === 'doc') {
            heading(S.title, 60, 44)
            const card = el('div', 'card doc', box)
            const lines = S.lines || []
            card.style.setProperty('--dsize', (S.textSize || (lines.length > 9 ? 28 : 34)) + 'px')
            const on = S.on || []
            card.innerHTML =
              '<div class="bar"><i></i><i></i><i></i><span>' +
              esc(S.file || '') +
              '</span></div><pre>' +
              lines
                .map(
                  (l, i) =>
                    '<span class="ln">' +
                    (on.length
                      ? '<span class="' +
                        (on.includes(i) ? 'on' : 'off') +
                        '">' +
                        (esc(l) || ' ') +
                        '</span>'
                      : esc(l) || ' ') +
                    '</span>'
                )
                .join('') +
              '</pre>'
            mustFit.push(box)
          } else if (layout === 'fields') {
            heading(S.title, 60, 44)
            const card = el('div', 'card fields', box)
            for (const f of S.fields || []) {
              const row = el('div', 'field', card)
              row.innerHTML =
                '<span class="k">' +
                esc(f.k) +
                '</span><span>' +
                rich(f.v) +
                '</span>' +
                (f.n
                  ? '<span class="n' + (f.bad ? ' bad' : '') + '">' + esc(f.n) + '</span>'
                  : '<span></span>')
            }
            if (S.note) el('div', 'note', box, rich(S.note))
            mustFit.push(box)
          } else if (layout === 'chat') {
            heading(S.title, 60, 44)
            const card = el('div', 'card chat', box)
            for (const b of S.bubbles || [])
              el('div', 'bubble ' + (b.role === 'user' ? 'user' : 'ai'), card, rich(b.text))
            if (S.note) el('div', 'note', box, rich(S.note))
            mustFit.push(box)
          } else if (layout === 'image') {
            heading(S.title, 56, 40)
            const w = el('div', 'imgwrap', box)
            const img = el('img', '', w)
            img.src = S._src || ''
            img.alt = S.alt || ''
            if (S.caption) el('div', 'caption', box, rich(S.caption))
          } else if (layout === 'screen' || layout === 'mock') {
            // a product screen: a real screenshot, or a UI recreated in the look (assets/screens.js)
            box.classList.add('scr-box')
            heading(S.title, 60, 40)
            const cs = getComputedStyle(stage)
            if (window.screens)
              window.screens.build(S, box, {
                lang: C.lang || 'en',
                vertical: vertical(),
                treat: C.treat,
                second: (T.second || cs.getPropertyValue('--second')).trim(),
                ground: (T.ground || cs.getPropertyValue('--ground')).trim()
              })
          } else if (layout === 'chapter') {
            box.classList.add('center')
            el('div', 'eyebrow', box, esc(S.eyebrow || ''))
            heading(S.text, 132, 72)
          } else if (layout === 'point') {
            if (S.title)
              el(
                'div',
                'of',
                box,
                esc(S.title) + (S.of ? ' · ' + S.n + ' ' + (S.ofWord || 'of') + ' ' + S.of : '')
              )
            const row = el('div', 'pointbig', box)
            el('span', 'num', row, esc(S.n ?? ''))
            const h = el('h1', 'h', row, withHl(S.text, S.highlight))
            fit(h, S.size || 104, 56)
            if (S.sub) el('div', 'sub', box, rich(S.sub))
          } else if (layout === 'word') {
            box.classList.add('word')
            heading(S.text, S.size || 240, 110)
            if (S.sub) el('div', 'sub', box, rich(S.sub))
          } else if (layout === 'doodle') {
            const row = el('div', 'doodle-row' + (S.text ? '' : ' solo'), box)
            row.insertAdjacentHTML('beforeend', doodle(S.draw))
            if (S.text) {
              const side = el('div', 'side', row)
              const h = el('h1', 'h', side, withHl(S.text, S.highlight))
              fit(h, S.size || 104, 56)
              if (S.sub) el('div', 'sub', side, rich(S.sub))
            }
            if (S.caption) el('div', 'doodle-cap', box, rich(S.caption))
            mustFit.push(box)
          } else if (layout === 'scene') {
            const many = (Array.isArray(S.cast) ? S.cast.length : 1) > 1
            // in a Short the text sits above the picture, so the cast stands as if there were none
            const textMode =
              S.text && !vertical() ? (many || S.textAt === 'top' ? 'top' : 'left') : 'none'
            const sc = window.scene ? window.scene(S, { textMode, mascot: C.mascot }) : null
            // with marks, the background and the cast are two pictures, so pins and paths sit between them
            if (sc && Array.isArray(S.marks) && S.marks.length) {
              const back = window.scene(
                { ...S, cast: [], props: [] },
                { textMode, mascot: C.mascot }
              )
              const front = window.scene({ ...S, bg: 'none' }, { textMode, mascot: C.mascot })
              stage.insertAdjacentHTML('afterbegin', back.svg + front.svg)
            } else if (sc) stage.insertAdjacentHTML('afterbegin', sc.svg)
            if (S.text) {
              box.classList.add(
                vertical() ? 'vtop' : textMode === 'top' ? 'scene-top' : 'scene-left'
              )
              if (S.bg && S.bg !== 'plain') box.classList.add('plate')
              heading(S.text, S.size || (textMode === 'left' ? 100 : 84), 48)
              if (S.sub) el('div', 'sub', box, rich(S.sub))
              mustFit.push(box)
            }
            bubbles(sc ? sc.cast : [])
          } else if (layout === 'illustration') {
            // one picture, or `layers` (a backdrop + cut-outs) the camera moves at their depths
            const world = el('div', 'world')
            stage.insertBefore(world, stage.firstChild)
            const pics = S._layers || (S._src ? [{ src: S._src, depth: S.depth ?? 1 }] : null)
            if (pics)
              pics.forEach((p, i) => {
                const L = el('div', 'layer', world)
                L.dataset.depth = p.depth ?? (pics.length > 1 ? i / (pics.length - 1) : 1)
                // a cut-out moved and sized in the frame (`x`, `y`, `scale`): its element is generated in the
                // middle, so a wrapper puts that centre at (x, y) and scales it; the wrapper keeps the placement
                // apart from the picture's own entrance animation and the layer's camera move
                let holder = L
                if (p.x != null || p.y != null || p.scale != null) {
                  holder = el('div', 'place', L)
                  holder.style.cssText =
                    'position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:960px 540px'
                  holder.style.transform = `translate(${(p.x ?? 960) - 960}px, ${(p.y ?? 540) - 540}px) scale(${p.scale ?? 1})`
                }
                const img = el('img', 'illus', holder)
                img.src = p.src
                if (p.blur) img.style.filter = `blur(${p.blur}px)`
              })
            else
              el(
                'div',
                'illus-ph',
                world,
                '<div><b>Illustration not generated yet</b><br>' +
                  esc(
                    S.prompt || S.src || (S.layers || []).map((l) => l.prompt || l.src).join(' · ')
                  ) +
                  '</div>'
              )
            // the cast (the mascot, a person, a robot) acting inside the picture, on the near layer
            const at = S.at || (S.cast && S.text ? 'left' : 'bottom')
            if (S.cast && window.scene) {
              const sc = window.scene(
                { ...S, bg: 'none' },
                {
                  textMode: S.text && !vertical() ? (at === 'top' ? 'top' : 'left') : 'none',
                  mascot: C.mascot
                }
              )
              world.insertAdjacentHTML('beforeend', sc.svg)
              bubbles(sc.cast)
            }
            if (S.text) {
              box.classList.add(vertical() ? 'vtop' : 'illus-' + at, 'plate')
              heading(S.text, S.size || 76, 44)
              if (S.sub) el('div', 'sub', box, rich(S.sub))
            }
          } else if (layout === 'quote') {
            el('div', 'qmark', box, '\u201C')
            heading(S.text, S.size || 96, 56, 'h italic')
            if (S.by) el('div', 'by', box, '— ' + rich(S.by))
          } else if (layout === 'subscribe') {
            heading(S.text, 88, 52)
            const ch = C.channel || {}
            const f = S._frame ?? 2
            const card = el('div', 'yt', box)
            if (window.YTICON && window.YTICON !== '__YTICON__')
              el('img', 'ytlogo', card).src = window.YTICON
            const av = el('div', 'av', card)
            if (ch.avatar) el('img', '', av).src = ch.avatar
            else av.textContent = (ch.name || '?').trim().charAt(0).toUpperCase()
            el(
              'div',
              'who',
              card,
              '<span class="name">' +
                esc(ch.name || '') +
                '</span>' +
                (ch.handle ? '<span class="handle">' + esc(ch.handle) + '</span>' : '')
            )
            const ICON = {
              bell: '<svg viewBox="0 0 24 24"><path d="M10 20h4c0 1.1-.9 2-2 2s-2-.9-2-2zm10-2.65V19H4v-1.65l2-1.88v-5.15C6 7.4 7.56 5.1 10 4.34v-.38c0-1.42 1.49-2.5 2.99-1.76.65.32 1.01 1.03 1.01 1.76v.39c2.44.75 4 3.06 4 5.98v5.15l2 1.87z"/></svg>',
              down: '<svg viewBox="0 0 24 24"><path d="m18 9.28-6.35 6.35-6.37-6.35.72-.71 5.64 5.65 5.65-5.65z"/></svg>',
              up: '<svg viewBox="0 0 24 24"><path d="M18.77 11h-4.23l1.52-4.94C16.38 5.03 15.54 4 14.38 4c-.58 0-1.14.24-1.52.65L7 11H3v10h14.43c1.06 0 1.98-.67 2.19-1.61l1.34-6c.27-1.24-.78-2.39-2.19-2.39zM7 20H4v-8h3v8z"/></svg>',
              dislike:
                '<svg viewBox="0 0 24 24"><path d="M17 4h-1H6.57C5.5 4 4.59 4.67 4.38 5.61l-1.34 6C2.77 12.85 3.82 14 5.23 14h4.23l-1.52 4.94C7.62 19.97 8.46 21 9.62 21c.58 0 1.14-.24 1.52-.65L17 14h4V4h-4zm-6.6 15.67c-.19.21-.46.33-.78.33-.53 0-.89-.53-.73-1.06l1.73-5.94H5.23c-.87 0-1.29-.73-1.24-1.17l1.34-6C5.39 5.33 5.85 5 6.57 5H16v8.61l-5.6 6.06zM20 13h-3V5h3v8z"/></svg>'
            }
            const pill = el(
              'div',
              'pill ' + (f >= 2 ? 'subbed' : 'sub') + (f === 1 ? ' pressed' : ''),
              card
            )
            pill.innerHTML =
              f >= 2
                ? ICON.bell + '<span>' + esc(S.done || 'Subscribed') + '</span>' + ICON.down
                : '<span>' + esc(S.button || 'Subscribe') + '</span>'
            if (f === 1) el('span', 'ring', pill)
            if (f >= 2)
              el(
                'span',
                'burst',
                pill,
                '<svg viewBox="0 0 70 70"><path d="M35 6v14M10 22l11 8M60 22l-11 8"/></svg>'
              )
            el('div', 'pill like', card, ICON.up + '<i></i>' + ICON.dislike)
            if (S.sub) el('div', 'sub', box, rich(S.sub))
            if (f >= 1) {
              const cur = el(
                'div',
                'cursor',
                stage,
                '<svg viewBox="0 0 24 24"><path d="M5 2.5v17.2l4.6-4.4 2.9 6.6 2.9-1.3-2.9-6.5H19z" fill="#fff" stroke="#000" stroke-width="1.3" stroke-linejoin="round"/></svg>'
              )
              const r = pill.getBoundingClientRect()
              const sr = stage.getBoundingClientRect()
              cur.style.left = r.left - sr.left + r.width * 0.62 + 'px'
              cur.style.top = r.top - sr.top + r.height * 0.5 + 'px'
            }
          } else if (layout === 'end') {
            const room = el('div', 'endroom', stage)
            el('div', 'v', room)
            el('div', 's', room)
            stage.appendChild(box)
            box.classList.add('endtop')
            heading(S.text, 84, 48)
          }
          // illustrated-world extras, on any layout (mostly scene and illustration): marks, particles
          if (Array.isArray(S.marks) && S.marks.length) buildMarks(S, layout)
          fxParts = []
          if (S.fx) buildFx(S, box.parentNode === stage ? box : null)
          if (vertical()) frameVertical(S, layout, box)
          return document.fonts.ready
        }

        // ---------- animation (optional) ----------
        // Entrances per layout (headline rises, highlight sweeps, rows and lines come in one by one, numbers
        // count up, doodles draw themselves, characters pop in and act out their pose), and for scenes an idle
        // loop (bob, blink, wave, twinkle) the renderer repeats while the voice runs. Slides continued from the
        // previous one (S._cont: same layout and title) only animate what changed.
        window.anim = function (S, o = {}) {
          A.forEach((a) => a.cancel())
          A = []
          ticks = []
          const sp = o.speed || 1
          const fps = o.fps || 30
          const EASE = 'cubic-bezier(.2,.8,.2,1)'
          const BOUNCE = 'cubic-bezier(.34,1.56,.64,1)'
          let end = 0
          const add = (e, kf, d, delay = 0, easing = EASE) => {
            if (!e) return
            const a = e.animate(kf, { duration: d / sp, delay: delay / sp, fill: 'both', easing })
            a.pause()
            A.push(a)
            end = Math.max(end, (delay + d) / sp)
          }
          const rise = (e, delay = 0, dist = 36, d = 560) =>
            add(
              e,
              [
                { opacity: 0, transform: `translateY(${dist}px)` },
                { opacity: 1, transform: 'none' }
              ],
              d,
              delay
            )
          const fade = (e, delay = 0, d = 420) => add(e, [{ opacity: 0 }, { opacity: 1 }], d, delay)
          const pop = (e, delay = 0, d = 520, from = 0.6) =>
            add(
              e,
              [
                { opacity: 0, transform: `scale(${from})` },
                { opacity: 1, transform: 'none' }
              ],
              d,
              delay,
              BOUNCE
            )
          const slideIn = (e, delay = 0, dx = -60, d = 520) =>
            add(
              e,
              [
                { opacity: 0, transform: `translateX(${dx}px)` },
                { opacity: 1, transform: 'none' }
              ],
              d,
              delay
            )
          const flash = (e, delay = 0) => add(e, [{ opacity: 0.25 }, { opacity: 1 }], 520, delay)
          const sweep = (e, delay = 0) => {
            if (!e) return
            const full = getComputedStyle(e).backgroundSize
            const hgt = full.split(' ')[1] || '40%'
            add(
              e,
              [{ backgroundSize: `0% ${hgt}` }, { backgroundSize: full }],
              520,
              delay,
              'cubic-bezier(.6,0,.3,1)'
            )
          }
          // a number counts up to its value (keeps prefix, suffix, commas and decimals)
          const count = (e, delay, d, fromText) => {
            if (!e) return
            const parse = (t) => {
              const m = String(t || '')
                .trim()
                .match(/^([^\d-]*)(-?[\d,]*\.?\d+)([^\d]*)$/)
              return (
                m && { pre: m[1], num: parseFloat(m[2].replace(/,/g, '')), raw: m[2], post: m[3] }
              )
            }
            // anim() can run twice on one slide (re-timed for a short slot): keep the real value
            if (e.dataset.final == null) e.dataset.final = e.textContent
            const final = e.dataset.final
            const to = parse(final)
            if (!to) return
            const from = parse(fromText)
            const start = from && from.post === to.post ? from.num : 0
            const dec = (to.raw.split('.')[1] || '').length
            const fmt = (v) =>
              to.pre +
              (to.raw.includes(',')
                ? v.toLocaleString('en-US', {
                    minimumFractionDigits: dec,
                    maximumFractionDigits: dec
                  })
                : v.toFixed(dec)) +
              to.post
            ticks.push((ms) => {
              const p = Math.min(1, Math.max(0, (ms - delay / sp) / (d / sp)))
              e.textContent =
                p >= 1 ? final : fmt(start + (to.num - start) * (1 - Math.pow(1 - p, 3)))
            })
            end = Math.max(end, (delay + d) / sp)
          }
          const $ = (q) => stage.querySelector(q)
          const $$ = (q) => [...stage.querySelectorAll(q)]
          const layout = S.layout || 'statement'
          const cont = !!S._cont
          const h = $('.box .h')
          const hl = $('.box .h .hl')
          const sub = $('.box .sub')
          const headline = (delay = 0) => {
            rise(h, delay)
            sweep(hl, delay + 420)
          }
          // the camera move (needs the slide's length: o.dur, seconds)
          const cam = o.dur ? cameraOf(S) : null
          const loops = [] // [element, keyframes] repeated every LOOP ms after the intro

          if (layout === 'statement') {
            headline(0)
            rise(sub, 260)
          } else if (layout === 'word') {
            add(
              h,
              [
                { opacity: 0, transform: 'scale(1.3)' },
                { opacity: 1, transform: 'none' }
              ],
              460,
              0,
              BOUNCE
            )
            sweep(hl, 380)
            rise(sub, 300)
          } else if (layout === 'point') {
            fade($('.of'), 0)
            pop($('.pointbig .num'), 0)
            rise(h, 120)
            sweep(hl, 540)
            rise(sub, 380)
          } else if (layout === 'chapter') {
            slideIn($('.eyebrow'), 0, -40, 480)
            rise(h, 140, 44, 700)
            sweep(hl, 700)
          } else if (layout === 'quote') {
            pop($('.qmark'), 0, 500, 0.4)
            rise(h, 160)
            fade($('.by'), 620)
          } else if (layout === 'points') {
            const items = $$('.points .point')
            if (S.visible != null) {
              if (!cont) rise(h, 0)
              slideIn(items[S.visible - 1], cont ? 0 : 200)
              if (S.visible > 1) pop(items[S.visible - 2].querySelector('.num'), 120)
            } else if (cont && S.current != null) {
              const it = items[S.current]
              add(
                it,
                [
                  { opacity: 0.45, transform: 'scale(.97)' },
                  { opacity: 1, transform: 'scale(1.02)', offset: 0.6 },
                  { opacity: 1, transform: 'none' }
                ],
                560
              )
            } else if (!cont) {
              rise(h, 0)
              items.forEach((it, i) => slideIn(it, 200 + i * 140))
            }
          } else if (layout === 'number') {
            if (!cont) rise(h, 0)
            const from = $('.bignum .from')
            fade(from, 150)
            slideIn($('.bignum .arrow'), 300, -30, 400)
            const to = $('.bignum .to')
            pop(to, from ? 420 : 150, 520, 0.85)
            count(to, from ? 420 : 150, 900, from && from.textContent)
            rise(sub, 450)
          } else if (layout === 'table') {
            if (cont) $$('.tablecard tr.mark').forEach((r) => flash(r, 0))
            else {
              rise(h, 0)
              rise($('.tablecard'), 100, 24, 480)
              const rows = $$('.tablecard tbody tr')
              rows.forEach((r, i) => rise(r, 280 + i * Math.min(90, 700 / rows.length), 14, 360))
              fade($('.note'), 500)
            }
          } else if (layout === 'doc') {
            if (cont) $$('.doc pre .on').forEach((e) => flash(e, 0))
            else {
              rise(h, 0)
              rise($('.doc'), 100, 24, 480)
              const lines = $$('.doc pre .ln')
              const step = Math.min(110, 1000 / Math.max(1, lines.length))
              lines.forEach((l, i) =>
                add(
                  l,
                  [
                    { clipPath: 'inset(-12px 100% -12px -12px)' },
                    { clipPath: 'inset(-12px -12px -12px -12px)' }
                  ],
                  320,
                  320 + i * step,
                  'linear'
                )
              )
            }
          } else if (layout === 'fields') {
            if (!cont) {
              rise(h, 0)
              rise($('.fields'), 100, 24, 480)
              $$('.field').forEach((f, i) => rise(f, 280 + i * 110, 14, 380))
              fade($('.note'), 500)
            }
          } else if (layout === 'chat') {
            if (!cont) rise(h, 0)
            fade($('.chat'), 80, 360)
            $$('.bubble').forEach((b, i) => {
              b.style.transformOrigin = b.classList.contains('user') ? '100% 100%' : '0 100%'
              pop(b, 260 + i * 380, 480, 0.7)
            })
            fade($('.note'), 400)
          } else if (layout === 'image') {
            rise(h, 0)
            add(
              $('.imgwrap'),
              [
                { opacity: 0, transform: 'scale(.94)' },
                { opacity: 1, transform: 'none' }
              ],
              700,
              120
            )
            fade($('.caption'), 500)
          } else if (layout === 'screen' || layout === 'mock') {
            if (!cont) rise(h, 0)
            if (window.screens) {
              const r = window.screens.anim(S, sp, !cont)
              A.push(...r.anims)
              end = Math.max(end, r.end)
            }
            if (!cont) fade($('.scr-foot'), 700)
          } else if (layout === 'doodle') {
            // the drawing draws itself: each stroke traced, then its fill comes in
            const shapes = $$(
              'svg.doodle path, svg.doodle rect, svg.doodle circle, svg.doodle ellipse, svg.doodle line, svg.doodle polyline, svg.doodle polygon, svg.doodle text'
            )
            const step = Math.min(160, 1100 / Math.max(1, shapes.length))
            shapes.forEach((e, i) => {
              const L =
                e.getTotalLength && getComputedStyle(e).stroke !== 'none' ? e.getTotalLength() : 0
              if (L > 0) {
                e.style.strokeDasharray = L + ' ' + L
                add(
                  e,
                  [
                    { strokeDashoffset: L, fillOpacity: 0 },
                    { strokeDashoffset: 0, fillOpacity: 0, offset: 0.7 },
                    { strokeDashoffset: 0, fillOpacity: 1 }
                  ],
                  560,
                  80 + i * step,
                  'ease-in-out'
                )
              } else fade(e, 80 + i * step, 300)
            })
            rise(h, 250)
            sweep(hl, 700)
            rise(sub, 450)
            fade($('.doodle-cap'), 600)
          } else if (layout === 'scene' || layout === 'illustration') {
            // the picture settles in (skipped when the camera moves it for the whole slide)
            if (!cam)
              add(
                layout === 'scene' ? $('svg.scene .bgall') : $$('.world .illus')[0],
                [
                  { transform: layout === 'scene' ? 'scale(1.05)' : 'scale(1.08)' },
                  { transform: 'none' }
                ],
                layout === 'scene' ? 1400 : 1600,
                0,
                'cubic-bezier(.2,.7,.2,1)'
              )
            $$('.world .illus')
              .slice(1)
              .forEach((c, i) => rise(c, 150 + i * 150, 60, 900))
            $$('svg.scene .prop .pin').forEach((p, i) => pop(p, 200 + i * 120, 520, 0.5))
            const box = $('.box.plate')
            if (box) rise(box, 0)
            else rise(h, 0)
            sweep(hl, 450)
            rise(sub, 250)
            const rot = (arm, deg) => `rotate(${arm.classList.contains('armL') ? deg : -deg}deg)`
            const ANG = (arm) => Number(arm.dataset.a)
            const swing = (arm, deg) => ({ transform: rot(arm, deg) })
            $$('svg.scene .fig').forEach((f, i) => {
              const d0 = 250 + i * 200
              const popG = f.querySelector('.pop')
              const act = f.querySelector('.act')
              const bob = f.querySelector('.bob')
              const arms = [...f.querySelectorAll('.arm')]
              const raised = arms.slice().sort((a, b) => ANG(b) - ANG(a))[0]
              add(
                popG,
                [
                  { opacity: 0, transform: 'translateY(80px) scale(.7)' },
                  { opacity: 1, transform: 'none' }
                ],
                560,
                d0,
                BOUNCE
              )
              fade(f.querySelector('.shadow'), d0, 400)
              const at = d0 + 380
              const kind = f.dataset.act
              const fromRest = (arm, d = 520) =>
                add(
                  arm,
                  [
                    swing(arm, 14),
                    swing(arm, ANG(arm) + (ANG(arm) > 14 ? 10 : -10)),
                    swing(arm, ANG(arm))
                  ],
                  d,
                  at
                )
              if (kind === 'wave' && raised)
                add(
                  raised,
                  [0, -35, 10, -35, 0].map((dd) => swing(raised, ANG(raised) + dd)),
                  1000,
                  at,
                  'ease-in-out'
                )
              else if (kind === 'talk' && raised)
                add(
                  raised,
                  [0, -22, 0, -22, 0].map((dd) => swing(raised, ANG(raised) + dd)),
                  900,
                  at,
                  'ease-in-out'
                )
              else if (kind === 'point' || kind === 'think')
                raised &&
                  fromRest(kind === 'think' ? arms.find((a) => ANG(a) < 0) || raised : raised)
              else if (kind === 'shrug' || kind === 'shock' || kind === 'hop') {
                arms.forEach((a) => fromRest(a, kind === 'shock' ? 320 : 480))
                const up = { shrug: -14, shock: -50, hop: -60 }[kind]
                add(
                  act,
                  kind === 'hop'
                    ? [
                        { transform: 'none' },
                        { transform: `translateY(${up}px)` },
                        { transform: 'none' },
                        { transform: `translateY(${up * 0.6}px)` },
                        { transform: 'none' }
                      ]
                    : [
                        { transform: 'none' },
                        { transform: `translateY(${up}px)`, offset: 0.4 },
                        { transform: 'none' }
                      ],
                  kind === 'hop' ? 900 : 460,
                  at,
                  'ease-in-out'
                )
              } else if (kind === 'droop')
                add(act, [{ transform: 'translateY(-10px)' }, { transform: 'none' }], 700, at)
              f.querySelectorAll('.x').forEach((x, j) =>
                x.classList.contains('drop')
                  ? add(
                      x,
                      [
                        { opacity: 0, transform: 'translateY(-24px)' },
                        { opacity: 1, transform: 'none' }
                      ],
                      600,
                      at + 300
                    )
                  : pop(x, at + 200 + j * 120, 420, 0.2)
              )
              // idle loop
              const lift = f.dataset.float === '1' ? -14 : -4
              loops.push([
                bob,
                [
                  { transform: 'none' },
                  { transform: `translateY(${lift}px)` },
                  { transform: 'none' }
                ]
              ])
              if (f.dataset.float === '1')
                loops.push([
                  f.querySelector('.shadow'),
                  [{ transform: 'none' }, { transform: 'scale(.86, 1)' }, { transform: 'none' }]
                ])
              const b = 0.62 + i * 0.1
              loops.push([
                f.querySelector('.eyes'),
                [
                  { transform: 'none' },
                  { transform: 'none', offset: b },
                  { transform: 'scaleY(.1)', offset: b + 0.04 },
                  { transform: 'none', offset: b + 0.08 },
                  { transform: 'none' }
                ]
              ])
              if (kind === 'wave' && raised)
                loops.push([
                  raised,
                  [0, -28, 0, -28, 0].map((dd) => swing(raised, ANG(raised) + dd))
                ])
            })
            $$('.speech').forEach((b, i) => pop(b, 950 + i * 450, 480, 0.5))
            $$('svg.scene .cloud').forEach((c, i) =>
              loops.push([
                c,
                [
                  { transform: 'none' },
                  { transform: `translateX(${i % 2 ? -10 : 10}px)` },
                  { transform: 'none' }
                ]
              ])
            )
            $$('svg.scene .star').forEach((st, i) => {
              if (i % 3) return
              const m = 0.25 + ((i * 37) % 50) / 100
              loops.push([st, [{ opacity: 1 }, { opacity: 0.2, offset: m }, { opacity: 1 }]])
            })
            $$('svg.scene .float').forEach((fl) =>
              loops.push([
                fl,
                [{ transform: 'none' }, { transform: 'translateY(-12px)' }, { transform: 'none' }]
              ])
            )
          }

          // flow: boxes pop in (in list order), each arrow draws itself once both its ends are there, labels
          // fade in, and a dot keeps running along every arrow. A continued slide (reveal) only adds the new box.
          if (layout === 'flow') {
            if (!cont) {
              rise($('.box .h'), 0)
              sweep(hl, 400)
            }
            const cards = $$('.fnode:not(.hidden)')
            const newest = S.visible != null ? S.visible - 1 : -1
            const order = cont ? cards.filter((c) => Number(c.dataset.i) === newest) : cards
            const at = new Map(order.map((c, j) => [Number(c.dataset.i), 250 + j * 300]))
            order.forEach((c) => pop(c, at.get(Number(c.dataset.i)), 480, 0.6))
            $$('svg.flow .fl-link').forEach((g) => {
              if (g.style.visibility === 'hidden') return
              const ts = [at.get(Number(g.dataset.from)), at.get(Number(g.dataset.to))].filter(
                (t) => t != null
              )
              if (!ts.length) return // both ends were already there: the arrow stays drawn
              const t = Math.max(...ts) + 150
              const line = g.querySelector('.fl-line')
              if (line.getAttribute('stroke-dasharray')) fade(g, t, 500)
              else {
                const L = Math.ceil(line.getTotalLength()) + 2
                line.style.strokeDasharray = `${L} ${L}`
                add(
                  line,
                  [{ strokeDashoffset: L }, { strokeDashoffset: 0 }],
                  600,
                  t,
                  'cubic-bezier(.5,0,.3,1)'
                )
              }
              pop(g.querySelector('.fl-head'), t + 550, 260, 0.2)
              fade($(`.flabel[data-k="${g.dataset.k}"]`), t + 450, 300)
            })
            $$('.fdot').forEach((d) =>
              loops.push([
                d,
                [
                  { offsetDistance: '0%', opacity: 0 },
                  { opacity: 1, offset: 0.15 },
                  { opacity: 1, offset: 0.85 },
                  { offsetDistance: '100%', opacity: 0 }
                ]
              ])
            )
          }

          // marks: pins drop, rings open and pulse, paths and arrows draw themselves, tags pop, one after another
          $$('.marks .mk').forEach((m, i) => {
            const at = 600 + i * 380
            const k = m.dataset.mk
            if (k === 'pin')
              add(
                m,
                [
                  { opacity: 0, transform: 'translateY(-90px)' },
                  { opacity: 1, transform: 'none' }
                ],
                620,
                at,
                BOUNCE
              )
            else if (k === 'ring') {
              pop(m, at, 620, 0.2)
              loops.push([
                m.querySelector('.mk-pulse'),
                [
                  { transform: 'scale(1)', opacity: 0.8 },
                  { transform: 'scale(1.35)', opacity: 0 }
                ]
              ])
            } else if (k === 'path' || k === 'arrow') {
              const line = m.querySelector('.mk-line')
              const L = Math.ceil(line.getTotalLength()) + 2
              line.style.strokeDasharray = `${L} ${L}`
              add(
                line,
                [{ strokeDashoffset: L }, { strokeDashoffset: 0 }],
                1200,
                at,
                'cubic-bezier(.5,0,.3,1)'
              )
              pop(m.querySelector('.mk-head'), at + 1100, 320, 0.2)
            } else if (k === 'tag') pop(m, m.classList.contains('on-pin') ? at - 200 : at, 440, 0.5)
          })

          // camera, particles and slow ambient loops run for the whole slide, so the renderer films every frame
          let full = false
          const depthLayers = cam ? $$('[data-depth]') : []
          if (depthLayers.length) {
            const D = o.dur * 1000
            for (const e of depthLayers) {
              const d = Math.max(0, Math.min(1, Number(e.dataset.depth) || 0))
              const a = e.animate(cameraFrames(cam, 0.3 + 0.7 * d), {
                duration: D,
                fill: 'both',
                easing: 'cubic-bezier(.45,.05,.55,.95)'
              })
              a.pause()
              A.push(a)
            }
            full = true
          }
          if (o.dur && fxParts.length) {
            for (const { e, kf, dur, p } of fxParts) {
              e.style.opacity = ''
              e.style.transform = ''
              const a = e.animate(kf, { duration: dur, delay: -p * dur, iterations: Infinity })
              a.pause()
              A.push(a)
            }
            full = true
          }
          if (full) {
            const slow = (e, kf, d) => {
              if (!e) return
              const a = e.animate(
                kf.map((k) => ({ easing: 'ease-in-out', ...k })),
                { duration: d, iterations: Infinity }
              )
              a.pause()
              A.push(a)
            }
            $$('svg.scene .aurora').forEach((e, i) =>
              slow(
                e,
                [
                  { transform: 'none', opacity: 1 },
                  { transform: `translateX(${i ? -50 : 60}px) scaleY(1.15)`, opacity: 0.7 },
                  { transform: 'none', opacity: 1 }
                ],
                7000 + i * 1800
              )
            )
            $$('svg.scene .glow').forEach((e) =>
              slow(
                e,
                [{ transform: 'none' }, { transform: 'scale(1.08)' }, { transform: 'none' }],
                5000
              )
            )
          }

          // snap the intro to whole frames; loops start right after it, so frame `intro*fps` is loop phase 0
          const intro = Math.ceil((end / 1000) * fps - 1e-6) / fps
          const LOOP = 2000
          for (const [e, kf] of loops) {
            if (!e) continue
            const a = e.animate(
              kf.map((k) => ({ easing: 'ease-in-out', ...k })),
              { duration: LOOP, delay: intro * 1000, iterations: Infinity }
            )
            a.pause()
            A.push(a)
          }
          window.seek(0)
          return { intro, loop: loops.length ? LOOP / 1000 : 0, full }
        }
        window.seek = function (t) {
          for (const a of A) a.currentTime = t * 1000
          for (const f of ticks) f(t * 1000)
        }

        window.check = function () {
          const issues = []
          issues.push(...markIssues)
          issues.push(...flowIssues)
          if (window.screens && stage.querySelector('.scr-view, .illus-ph'))
            issues.push(...window.screens.issues())
          for (const { h, min } of fitTargets) {
            const box = h.closest('.box')
            if (box.scrollHeight > box.clientHeight + 2 || h.scrollWidth > h.clientWidth + 2)
              issues.push('text does not fit even at ' + min + 'px: shorten it')
          }
          for (const b of mustFit)
            if (b.scrollHeight > b.clientHeight + 2)
              issues.push(
                'content is ' + (b.scrollHeight - b.clientHeight) + 'px too tall: cut rows/lines'
              )
          stage.querySelectorAll('img').forEach((i) => {
            if (
              (i.closest('.imgwrap') || i.closest('.scr-pic') || i.classList.contains('illus')) &&
              !i.naturalWidth
            )
              issues.push('image did not load')
          })
          const sr = stage.getBoundingClientRect()
          const head = stage.querySelector('.box .h')
          const hr = head && head.getBoundingClientRect()
          for (const b of speech) {
            const r = b.getBoundingClientRect()
            if (r.height > 230) issues.push('speech bubble is over 3 lines: shorten its `say`')
            if (r.left < sr.left + 16 || r.right > sr.right - 16 || r.top < sr.top + 110)
              issues.push(
                'speech bubble runs off the frame: shorten its `say` or use fewer characters'
              )
            if (
              hr &&
              r.top < hr.bottom &&
              r.bottom > hr.top &&
              r.left < hr.right &&
              r.right > hr.left
            )
              issues.push('speech bubble covers the text: shorten one of them, or drop `text`')
          }
          return [...new Set(issues)]
        }
      })()
    </script>
  </body>
</html>
